<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #dee4f0 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 400px;
            border-radius: 12px;
            padding: 30px;
            background: #fff;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
        }

        .login-title {
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            color: #34495e;
        }

        .small-error {
            font-size: 13px;
            color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="login-card">

    <h2 class="login-title">Login</h2>

    <!-- Error message (JS only) -->
    <div id="loginError" class="alert alert-danger text-center d-none">
        Invalid email or password!
    </div>

    <form id="form">

        <!-- Email -->
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email">
            <div class="small-error" id="emailError"></div>
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password">
            <div class="small-error" id="passwordError"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>

        <p class="mt-3 text-center">
            Don’t have an account? <a href="register.html">Register here</a>
        </p>

    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const form = document.getElementById("form");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const loginError = document.getElementById("loginError");

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        // Reset error messages
        document.getElementById("emailError").innerText = "";
        document.getElementById("passwordError").innerText = "";
        loginError.classList.add("d-none");

        let valid = true;

        if (email.value.trim() === "") {
            document.getElementById("emailError").innerText = "Email is required";
            valid = false;
        }

        if (password.value.trim() === "") {
            document.getElementById("passwordError").innerText = "Password is required";
            valid = false;
        }

        if (!valid) return;

        // Fake login check for demo
        if (email.value !== "test@example.com" || password.value !== "123456") {
            loginError.classList.remove("d-none");
        } else {
            alert("Login successful!");
            // Redirect example:
            // window.location.href = "dashboard.html";
        }
    });
</script>

</body>
</html>
