<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookworm - Sign Up</title>
    <link rel="stylesheet" href="signIn.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" style="text-decoration: none; color: rgb(0, 40, 170);"><h2>←</h2></a>
            <div class="logo">
                <img src="logo.png" alt="Clevr Logo">
                <h3>Bookworm</h3>
            </div>
            <h2 class="auth-heading">Create your account</h2>
            <form action="process.php" method="POST" class="auth-form">
                <div class="form-group">
                    <label>First and Last Name:</label>
                    <input type="text" name="fullname" class="auth-form" placeholder="Enter your First and Last Name" required>
                </div>
                <div class="form-group">
                    <label>Gender:</label>
                    <select name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date of Birth:</label>
                    <input type="date" name="dob" required>
                </div>
                <div class="form-group">
                    <label>Email Address:</label>
                    <input type="email" name="email" placeholder="Enter your Email Address" required>
                </div>
                <div class="form-group">
                    <label>Home Address:</label>
                    <input type="text" name="address"placeholder="Enter your Home Address" required>
                </div>
                <div class="form-group">
                    <label>Short Description:</label>
                    <textarea name="description" rows="4" required></textarea>
                </div>
                <button type="submit" class="form-button">Sign Up</button>
                
            </form>
            <p class="switch-page-link">
                Already have an account? <a href="login.html">Log In</a>
            </p>
        </div>
    </div>
</body>
</html>
